name: Deploy safe public Betonarka demo to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "betonarka-demo-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout only demo branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Prepare safe static site
        run: |
          mkdir -p _site
          cp index.html weekboard.css concrete.css .nojekyll _site/
      - name: Configure Pages (enable if allowed by GitHub plan)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload demo only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
