justify-content:space-between;gap:15px;margin-bottom:31px}.eyebrow{font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:800;color:var(--brand);margin-bottom:7px}.top h1{margin:0;font-size:clamp(28px,3.3vw,42px);font-weight:760;letter-spacing:-1.6px;line-height:1.14}.top p{margin:9px 0 0;color:var(--sub)}.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 13px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:41px}.btn:hover{border-color:#a9c9ba}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.primary:hover{background:#235547}.btn.ghost{background:transparent}.btn.small{min-height:31px;padding:5px 10px;font-size:12px}.btn.danger{color:var(--red)}.overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:24px}.metric,.panel,.day-tile,.note-tile{background:var(--surface);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.metric{padding:19px 21px}.metric span{color:var(--sub);font-size:13px}.metric strong{display:block;font-size:28px;letter-spacing:-.7px;margin-top:5px}.metric .hint{font-size:12px;color:var(--sub);margin:2px 0 0}.day-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.83fr);gap:19px}.panel{padding:23px}.panel+.panel{margin-top:19px}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.panel-title h2{font-size:19px;letter-spacing:-.4px;margin:0}.subline{font-size:12px;color:var(--sub)}.date-nav{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}.date-nav>strong{margin:0 2px;font-size:16px}.icon-btn{height:37px;min-width:37px;border:1px solid var(--line);background:white;border-radius:10px;font-size:19px;color:#4d665b}.date-input{border:1px solid var(--line);padding:8px 10px;border-radius:10px;background:#fff;min-height:37px;max-width:155px}.task-list{display:grid;gap:9px}.task{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 12px;background:#fff;transition:background .2s}.task:hover{background:#fbfcfa}.task.done{opacity:.57}.task.done .task-name{text-decoration:line-through}.check{margin-top:3px;width:19px;height:19px;accent-color:var(--brand);flex-shrink:0;cursor:pointer}.task-main{flex:1;min-width:0}.task-name{font-weight:690;overflow-wrap:anywhere}.task-desc{color:var(--sub);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}.task-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:5px}.chip{padding:2px 7px;border-radius:6px;background:#f0f3f0;color:#617168}.chip.high{background:#fcf0e9;color:#b06432}.chip.low{background:#eef0f7;color:#69769a}.task-actions{display:flex;gap:1px}.more{border:0;background:transparent;font-size:16px;color:var(--sub);padding:4px 6px;border-radius:7px}.more:hover{background:#edf4f0}.empty{padding:28px 18px;border:1px dashed #d7e1da;border-radius:12px;text-align:center;color:var(--sub);font-size:13px}.empty strong{display:block;color:#5d7065;font-size:17px;margin-bottom:4px}.note-editor{border:1px solid var(--line);border-radius:12px;padding:13px;width:100%;min-height:180px;resize:vertical;line-height:1.65;background:#fcfdfb;color:var(--ink)}.small-save{font-size:11px;color:var(--sub);margin-top:6px;min-height:19px}.goal-list{display:grid;gap:9px}.goal{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:10px 11px}.goal.done .goal-name{text-decoration:line-through;color:var(--sub)}.goal-name{flex:1;overflow-wrap:anywhere}.inline-add{display:flex;gap:7px;margin-top:13px}.inline-add input{border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-width:0;flex:1;background:#fcfdfb}.hint-line{margin-top:9px;font-size:12px;color:var(--sub)}.weekhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(155px,1fr));gap:12px;overflow:auto;padding-bottom:9px}.day-tile{padding:13px;min-height:270px;display:flex;flex-direction:column;gap:12px}.day-tile.today{border:2px solid var(--brand);padding:12px}.day-tile.selected{background:#f2f7f3}.day-tile .day-header{display:flex;align-items:center;justify-content:space-between;gap:8px}.day-name{font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.6px;color:var(--sub)}.day-num{font-size:26px;font-weight:800;letter-spacing:-1px}.week-task{padding:9px;border:1px solid #e4eae5;border-radius:10px;background:#fff;display:flex;gap:6px;align-items:flex-start;min-width:0}.week-task .task-name{font-size:12px;font-weight:670;line-height:1.3;cursor:pointer}.week-task.done{opacity:.55}.week-task.done .task-name{text-decoration:line-through}.week-task .check{width:16px;height:16px;margin-top:0}.week-task .tag-dot{width:5px;min-width:5px;height:5px;border-radius:50%;background:var(--brand);margin-top:6px}.week-task.high .tag-dot{background:var(--orange)}.week-list{display:grid;gap:7px;align-content:start;flex:1}.week-add{border:1px dashed #cfddd4;background:#f9fcfa;border-radius:9px;color:var(--brand);min-height:32px;font-size:12px;font-weight:700;width:100%}.week-footer{border-top:1px solid var(--line);padding-top:20px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.notes-top{display:flex;align-items:center;justify-content:space-between;gap:13px;margin-bottom:18px;flex-wrap:wrap}.notes-top input{border:1px solid var(--line);border-radius:11px;padding:11px 14px;min-width:min(100%,300px);background:white}.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}.note-tile{padding:18px;min-height:170px;display:flex;flex-direction:column;cursor:pointer;text-align:left;color:inherit}.note-tile:hover{border-color:#a7c8ba}.note-tile h3{font-size:16px;margin:0 0 7px;overflow-wrap:anywhere}.note-tile p{font-size:13px;color:var(--sub);white-space:pre-wrap;overflow-wrap:anywhere;margin:0;flex:1;max-height:113px;overflow:hidden}.note-tile footer{font-size:11px;color:var(--sub);margin-top:18px}.strip{background:#fff7ef;border:1px solid #f1d8bd;padding:13px 15px;border-radius:12px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:#8c5e37}.strip strong{font-size:13px}.tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tab{border:0;background:#f2f5f1;padding:7px 12px;border-radius:9px;color:#68776c;font-size:12px;font-weight:750}.tab.active{background:var(--brand-soft);color:var(--brand)}.modal-layer{position:fixed;inset:0;background:rgba(22,39,34,.36);z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.modal-layer.open{display:flex}.modal{width:min(100%,490px);background:white;border-radius:21px;padding:26px;box-shadow:0 26px 90px rgba(20,40,32,.22);max-height:90vh;overflow-y:auto}.modal h2{margin:0 0 17px;font-size:22px}.fields{display:grid;gap:13px}.field{display:grid;gap:5px;font-size:12px;color:#586b60;font-weight:750}.field input,.field select,.field textarea{padding:11px;border-radius:10px;border:1px solid var(--line);background:#fcfdfb;color:var(--ink);width:100%;font-weight:450}.field textarea{min-height:130px;resize:vertical}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:21px;flex-wrap:wrap}.modal-actions .delete{margin-right:auto}.mobile-nav{display:none}.toast{position:fixed;bottom:22px;right:25px;background:#203c31;color:white;border-radius:11px;padding:10px 15px;box-shadow:0 10px 35px #153e292f;font-size:13px;opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s;z-index:30}.toast.show{opacity:1;transform:translateY(0)}.backup-footer{display:flex;align-items:center;justify-content:space-between;gap:13px;flex-wrap:wrap;margin-top:25px;padding:16px 2px;color:var(--sub);font-size:12px}.backup-footer .buttons{display:flex;gap:8px;flex-wrap:wrap}.week-swipe-hint{display:none}.visually-hidden{position:absolute;left:-10000px}
    @media(max-width:1100px){.week-grid{grid-template-columns:repeat(7,minmax(175px,1fr))}.day-layout{grid-template-columns:minmax(0,1.1fr) minmax(260px,.9fr)}}
    @media(max-width:850px){.sidebar{width:72px;padding:24px 10px}.logo{padding:0 8px}.logo span:last-child,.side-label,.nav .nav-label,.sidebar-bottom{display:none}.nav button{justify-content:center;padding:11px}.nav .symbol{font-size:21px}.main{padding:27px 22px 54px}.day-layout{grid-template-columns:1fr}.overview{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{padding:15px}}
    @media(max-width:570px){.sidebar{display:none}.mobile-nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:#fff;padding:8px 8px max(8px,env(safe-area-inset-bottom));box-shadow:0 -7px 20px #1a33211b}.mobile-nav button{border:0;background:transparent;color:#78857b;font-size:11px;font-weight:700;padding:6px;display:flex;align-items:center;flex-direction:column;gap:1px}.mobile-nav button.active{color:var(--brand)}.mobile-nav .symbol{font-size:21px}.main{padding:22px 15px 100px}.top{flex-direction:column;align-items:flex-start;margin-bottom:22px;gap:16px}.top h1{font-size:30px}.top-actions{width:100%}.top-actions .btn.primary{flex:1}.overview{gap:8px}.metric{padding:12px 11px;border-radius:13px}.metric span{font-size:11px}.metric strong{font-size:24px}.metric .hint{font-size:10px}.panel{padding:16px}.week-footer{grid-template-columns:1fr}.week-swipe-hint{display:block;font-size:12px;color:var(--sub);margin:-10px 0 12px}.field-row{grid-template-columns:1fr}.modal{padding:20px}.notes-top input{min-width:100%}}
  </style>

<body>
<div class="app">
  <aside class="sidebar" aria-label="Навігація">
    <div class="logo"><span class="logo-mark">✦</span><span>Бетонарка</span></div>
    <div><div class="side-label">Мій простір</div><nav class="nav" id="navDesktop"></nav></div>
    <div class="sidebar-bottom">Замовлення й контакти залишаються в цьому браузері. Робіть резервні копії.<br><button type="button" id="exportSide">↓ Зберегти копію</button><br><button type="button" id="importSide">↑ Відновити копію</button><br><a class="sidebar-project-link" href="https://github.com/TechSite-Solutions/Betonarka-Manager" target="_blank" rel="noopener noreferrer" title="Відкрити репозиторій бетонарки на GitHub">↗ GitHub · Проєкт</a></div>
  </aside>
  <main class="main"><header class="top"><div><div class="eyebrow" id="eyebrow">Особистий планувальник</div><h1 id="pageTitle">Мій тиждень</h1><p id="pageSubtitle">Менше хаосу, більше ясності.</p></div><div class="top-actions"><button class="btn" type="button" id="goToday">Сьогодні</button><button class="btn primary" type="button" id="newTask">＋ Нове завдання</button></div></header><div id="appContent"></div><footer class="backup-footer"><span>Дані зберігаються в цьому браузері. Створюй копії, щоб нічого не втратити.</span><div class="buttons"><button type="button" class="btn small" data-export>↓ Зберегти копію</button><button type="button" class="btn small" data-import>↑ Відновити</button><a class="btn small project-footer-link" href="https://github.com/TechSite-Solutions/Betonarka-Manager" target="_blank" rel="noopener noreferrer" title="Сторінка проєкту на GitHub">↗ GitHub · Проєкт</a></div></footer></main>
</div>
<nav class="mobile-nav" id="navMobile" aria-label="Мобільна навігація"></nav>
<div class="modal-layer" id="modalLayer" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div><input type="file" id="backupFile" accept="application/json,.json" class="visually-hidden">
<script>
(function(){
'use strict';
const KEY='den-za-dnem-planner-v1'; // ключ збережено для сумісності зі старою версією
const WEEKDAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
const MONTHS=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const $=s=>document.querySelector(s);
const today=()=>toISO(new Date());
function toISO(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function fromISO(v){const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d,12)}
function addDays(iso,n){const d=fromISO(iso);d.setDate(d.getDate()+n);return toISO(d)}
function monday(iso){const d=fromISO(iso);d.setDate(d.getDate()-((d.getDay()+6)%7));return toISO(d)}
function humanDate(iso){const d=fromISO(iso);return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`}
function shortDate(iso){const d=fromISO(iso);return `${d.getDate()} ${MONTHS[d.getMonth()]}`}
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return (typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`}
function baseData(){return {version:3,tasks:[],dailyNotes:{},goals:[],weeklyNotes:{},notes:[],weeklyChecklist:{},orders:[]}}
function validate(data){if(!data||!Array.isArray(data.tasks)||!Array.isArray(data.goals)||!Array.isArray(data.notes)||!data.dailyNotes||typeof data.dailyNotes!=='object'||Array.isArray(data.dailyNotes))throw new Error('Некоректний файл планувальника');return {version:3,orders:Array.isArray(data.orders)?data.orders.filter(o=>o&&typeof o.customer==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(o.date)).map(o=>({...o,id:o.id||uid(),customer:String(o.customer),concrete:String(o.concrete||''),quantity:Number(o.quantity)||0,status:['new','confirmed','enroute','done','cancelled'].includes(o.status)?o.status:'new',pumpType:['none','small','large'].includes(o.pumpType)?o.pumpType:'none'})):[],tasks:data.tasks.filter(t=>t&&typeof t.title==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)).map(t=>({...t,id:t.id||uid(),done:!!t.done,priority:['high','normal','low'].includes(t.priority)?t.priority:'normal',color:['none','green','orange','pink','yellow'].includes(t.color)?t.color:'none'})),goals:data.goals.filter(g=>g&&typeof g.title==='string'&&typeof g.week==='string'),notes:data.notes.filter(n=>n&&typeof n.title==='string'),dailyNotes:data.dailyNotes,weeklyNotes:data.weeklyNotes&&typeof data.weeklyNotes==='object'&&!Array.isArray(data.weeklyNotes)?data.weeklyNotes:{},weeklyChecklist:data.weeklyChecklist&&typeof data.weeklyChecklist==='object'&&!Array.isArray(data.weeklyChecklist)?data.weeklyChecklist:{}}}
function load(){try{const v=localStorage.getItem(KEY);return v?validate(JSON.parse(v)):baseData()}catch(e){console.error('Не вдалося прочитати дані',e);return baseData()}}
let data=load(), view='week', date=today(), filter='all', notesQuery='', ordersQuery='', activeModal=null, toastTimer=null, autosaveTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){notify('Не вдалося зберегти дані. Зробіть резервну копію.');return false}}
function notify(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200)}
function setView(v){view=v;filter='all';render()}
const pages={week:{symbol:'▦',label:'План бетонарки',title:'План бетонарки',subtitle:'Замовлення бетону та справи на весь тиждень.'},orders:{symbol:'▣',label:'Замовлення',title:'Замовлення бетону',subtitle:'Клієнти, рецептури, об’єми, насоси й адреси доставок.'},day:{symbol:'◷',label:'Мій день',title:'Мій день',subtitle:'Завдання та поставки на вибраний день.'},notes:{symbol:'▤',label:'Записник',title:'Мої нотатки',subtitle:'Ідеї, думки й усе, що варто зберегти.'}};
function navHtml(){return Object.entries(pages).map(([k,v])=>`<button type="button" class="${view===k?'active':''}" data-view="${k}" ${view===k?'aria-current="page"':''}><span class="symbol">${v.symbol}</span><span class="nav-label">${v.label}</span></button>`).join('')}
function render(){document.body.classList.toggle('week-open',view==='week');const p=pages[view];$('#navDesktop').innerHTML=navHtml();$('#navMobile').innerHTML=navHtml();$('#pageTitle').textContent=p.title;$('#pageSubtitle').textContent=p.subtitle;$('#eyebrow').textContent=view==='notes'?'Простір для думок':view==='week'?`Тиждень від ${shortDate(monday(date))}`:humanDate(date);$('#goToday').hidden=view==='notes';$('#newTask').textContent=view==='notes'?'＋ Нова нотатка':(view==='week'||view==='orders')?'＋ Замовлення бетону':'＋ Нове завдання';$('#appContent').innerHTML=view==='day'?renderDay():view==='week'?renderWeek():view==='orders'?renderOrders():renderNotes()}
function tasksOn(iso){return data.tasks.filter(t=>t.date===iso).sort((a,b)=>Number(a.done)-Number(b.done) || (a.time||'99:99').localeCompare(b.time||'99:99') || ({high:0,normal:1,low:2}[a.priority]-{high:0,normal:1,low:2}[b.priority]))}
function counts(tasks){return {all:tasks.length,done:tasks.filter(t=>t.done).length,pending:tasks.filter(t=>!t.done).length}}
function ordersOn(day){return data.orders.filter(o=>o.date===day).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')||(a.customer||'').localeCompare(b.customer||''))}
function metric(name,val,hint){return `<div class="metric"><span>${name}</span><strong>${val}</strong><div class="hint">${hint}</div></div>`}
function taskHtml(t){let chips=`${t.time?`<span>◷ ${escapeHtml(t.time)}</span>`:''}${t.priority==='high'?'<span class="chip high">Важливе</span>':t.priority==='low'?'<span class="chip low">Не термінове</span>':''}${t.category?`<span class="chip">${escapeHtml(t.category)}</span>`:''}`;return `<div class="task ${t.done?'done':''}"><input class="check" type="checkbox" data-check-task="${escapeHtml(t.id)}" ${t.done?'checked':''} aria-label="Виконано: ${escapeHtml(t.title)}"><div class="task-main"><div class="task-name">${escapeHtml(t.title)}</div>${t.description?`<div class="task-desc">${escapeHtml(t.description)}</div>`:''}<div class="task-meta">${chips}</div></div><div class="task-actions"><button class="more" title="Редагувати" type="button" data-edit-task="${escapeHtml(t.id)}">✎</button></div></div>`}

function ensureChecklist(week){
  if(!Array.isArray(data.weeklyChecklist[week]))data.weeklyChecklist[week]=[];
  const items=data.weeklyChecklist[week];
  while(items.length<14)items.push({text:'',done:false});
  return items;
}
function boardTask(t){
  const color=['green','orange','pink','yellow'].includes(t.color)?t.color:'none';
  const title=`${t.time&&t.time.slice(3)!=='00'?t.time+' ':''}${t.title}`;
  return `<span class="board-task mark-${color} ${t.done?'is-done':''}" title="${escapeHtml(title)}"><input class="check" type="checkbox" data-check-task="${escapeHtml(t.id)}" ${t.done?'checked':''} aria-label="Виконано: ${escapeHtml(t.title)}"><button type="button" data-edit-task="${escapeHtml(t.id)}" title="Редагувати: ${escapeHtml(t.title)}">${escapeHtml(title)}</button></span>`;
}
function boardSlot(day,hour,compact=false){
  const items=tasksOn(day).filter(t=>t.time&&Number(t.time.slice(0,2))===hour&&/^\d\d:\d\d$/.test(t.time));
  const orders=ordersOn(day).filter(o=>o.time&&Number(o.time.slice(0,2))===hour&&/^\d\d:\d\d$/.test(o.time));
  const label=`${String(hour).padStart(2,'0')}:00`;
  return `<div class="board-slot ${items.length||orders.length?'has-task':''} ${orders.length?'has-order':''}" data-day="${day}" data-hour="${label}"><div class="board-time">${compact?hour:label}</div><div class="board-cell" data-slot-order="${day}" data-hour="${label}" title="Натисни на порожнє місце, щоб створити замовлення">${orders.map(boardOrder).join('')}${items.map(boardTask).join('')}<button class="board-order-slot-add" type="button" data-add-order="${day}" data-hour="${label}" title="Нове замовлення бетону" aria-label="Додати замовлення бетону ${day} о ${label}">▣</button><button class="board-slot-add" type="button" data-slot-add="${day}" data-hour="${label}" aria-label="Додати завдання на ${day} о ${label}" title="Відкрити форму звичайної справи">+</button></div></div>`;
}
function boardAnytime(day){
  const unassigned=tasksOn(day).filter(t=>!(t.time&&/^\d\d:\d\d$/.test(t.time)&&BOARD_HOURS.includes(Number(t.time.slice(0,2)))));
  const otherOrders=ordersOn(day).filter(o=>!(o.time&&/^\d\d:\d\d$/.test(o.time)&&BOARD_HOURS.includes(Number(o.time.slice(0,2)))));
  return `<div class="board-anytime"><span class="board-anytime-head">Без часу / поза розкладом</span>${otherOrders.map(boardOrder).join('')}${unassigned.map(boardTask).join('')}<button class="board-add-anytime" type="button" data-add-order="${day}">＋ Бетон</button><button class="board-add-anytime" type="button" data-add-on="${day}">＋ Додати</button></div>`;
}
function boardDay(day,index){
  const isWeekend=index>=5;

  const hours=`<div class="board-time-rows">${BOARD_HOURS.map(h=>boardSlot(day,h,isWeekend)).join('')}</div>`;
  if(isWeekend)return `<section class="board-weekend">${head}${hours}${boardAnytime(day)}<div class="board-weekend-note"><textarea data-board-note="${day}" aria-label="Нотатки ${CZ_DAYS[index]}" placeholder="Нотатки на день…">${escapeHtml(data.dailyNotes[day]||'')}</textarea></div></section>`;
  return `<section class="board-day">${head}${hours}${boardAnytime(day)}<div class="board-reminder"><div class="board-label">NEZAPOMEŇ</div><textarea data-board-note="${day}" aria-label="Не забути: ${CZ_DAYS[index]}" placeholder="Що не забути…">${escapeHtml(data.dailyNotes[day]||'')}</textarea></div></section>`;
}
function boardSidebar(week){

      <div class="field-row"><label class="field">Контактна особа / Kontaktní osoba${fd('contactName',o?.contactName||'','maxlength="150" placeholder="Ім’я на будівництві"')}</label><label class="field">Телефон *${fd('phone',o?.phone||'','type="tel" maxlength="60" required placeholder="+420 777 000 000"')}</label></div>
      <label class="field">E-mail (необов’язково)${fd('email',o?.email||'','type="email" maxlength="254" placeholder="zakaznik@example.cz"')}</label>
      <div class="field-row"><label class="field">Стан замовлення<select name="status">${Object.entries(ORDER_STATUSES).map(([v,l])=>`<option value="${v}" ${status===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="field">Примітка (оператор / водій)<textarea name="notes" maxlength="2000" rows="2" placeholder="Під’їзд, особливі умови, уточнення…">${escapeHtml(o?.notes||'')}</textarea></label></div>
    </fieldset>
    ${footer}
  </form>`);
  $('#modalLayer .modal').classList.add('concrete-modal');
  activeModal={kind:'order',id,mode};
  togglePumpField();
  // Keep populated fields visible but disabled in view mode.
  if(viewing)$('#orderForm').querySelector('fieldset').disabled=true;
  if(!viewing)$('#orderForm [name="customer"]')?.focus();
  else $('#modalLayer .modal').scrollTop=0;
}

function shiftProposedOrder(minutes){
  const form=$('#rescheduleOrderForm');if(!form)return;
  const day=form.elements.newDate.value, time=form.elements.newTime.value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||!/^\d{2}:\d{2}$/.test(time)){notify('Вкажи дату й час');return}
  const value=new Date(`${day}T${time}:00Z`);
  if(!Number.isFinite(value.getTime())){notify('Невірна дата або час');return}
  value.setUTCMinutes(value.getUTCMinutes()+minutes);
  form.elements.newDate.value=value.toISOString().slice(0,10);
  form.elements.newTime.value=value.toISOString().slice(11,16);
  const hint=$('#rescheduleHint');if(hint)hint.textContent=`Новий термін: ${form.elements.newDate.value} о ${form.elements.newTime.value}`;
}
function submitReschedule(form){
  if(activeModal?.kind!=='order'||activeModal.mode!=='view'||!activeModal.id)return;
  const o=data.orders.find(x=>x.id===activeModal.id);if(!o)return;
  const newDate=form.elements.newDate.value,newTime=form.elements.newTime.value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(newDate)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(newTime)){notify('Вкажи правильні дату й час');return}
  if(o.date===newDate&&o.time===newTime){notify('Дата й час не змінилися');return}
  const oldDate=o.date,oldTime=o.time;
  o.date=newDate;o.time=newTime;o.updatedAt=new Date().toISOString();
  if(!save()){o.date=oldDate;o.time=oldTime;return}
  date=newDate;render();orderForm(o.id);notify('Поставку перенесено на '+newDate+' о '+newTime);
}
function submitOrder(formEl){
 const f=new FormData(formEl);const str=k=>String(f.get(k)||'').trim();const qty=Number(str('quantity').replace(',','.'));
 if(!Number.isFinite(qty)||qty<=0){alert('Кількість бетону має бути більшою за 0 м³.');return}
 const pumpType=str('pumpType');const pumpLength=pumpType==='large'?Number(str('pumpLength')):null;
 if(pumpType==='large'&&(!Number.isFinite(pumpLength)||pumpLength<36)){alert('Для великого насоса вкажіть стрілу від 36 м.');return}
 const obj={date:str('date'),time:str('time'),customer:str('customer'),concrete:str('concrete'),quantity:qty,fraction:str('fraction'),pumpType,pumpLength,address:str('address'),contactName:str('contactName'),phone:str('phone'),email:str('email'),status:str('status'),notes:str('notes'),updatedAt:new Date().toISOString()};
 const previous=JSON.stringify(data.orders);
 let savedId=activeModal?.id;
 if(savedId){const o=data.orders.find(x=>x.id===savedId);if(o)Object.assign(o,obj)}
 else{savedId=uid();data.orders.push({...obj,id:savedId,createdAt:new Date().toISOString()})}
 if(!save()){data.orders=JSON.parse(previous);return}
 date=obj.date;render();orderForm(savedId);notify('Замовлення бетону збережено');
}

function renderNotes(){const q=notesQuery.trim().toLowerCase(),notes=data.notes.filter(n=>(n.title+' '+(n.body||'')).toLowerCase().includes(q)).sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||(b.updatedAt||'').localeCompare(a.updatedAt||''));return `<div class="notes-top"><input id="notesSearch" type="search" placeholder="⌕ Пошук нотаток…" aria-label="Пошук нотаток" value="${escapeHtml(notesQuery)}"><div class="muted" style="font-size:13px">${notes.length} нотаток</div></div><div class="notes-grid" id="notesGrid">${notes.length?notes.map(n=>`<button class="note-tile" type="button" data-edit-note="${escapeHtml(n.id)}"><h3>${n.pinned?'📌 ':''}${escapeHtml(n.title||'Без назви')}</h3><p>${escapeHtml(n.body||'Порожня нотатка')}</p><footer>${n.updatedAt?new Date(n.updatedAt).toLocaleDateString('uk-UA'):'Без дати'}</footer></button>`).join(''):'<div class="empty" style="grid-column:1/-1"><strong>Нотаток ще немає</strong>Збережи думку, ідею або корисну інформацію.</div>'}</div>`}
function syncNotes(){const n=$('#dailyNote'),w=$('#weeklyNote');if(n)n.value=String(data.dailyNotes[date]||'');if(w)w.value=String(data.weeklyNotes[monday(date)]||'')}
const originalRender=render;render=function(){originalRender();syncNotes()};
function openModal(title,body){activeModal=true;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalLayer').classList.add('open');const first=$('#modalBody input:not([type=hidden]),#modalBody textarea');if(first)first.focus()}
function closeModal(){activeModal=null;$('#modalLayer').classList.remove('open');$('#modalLayer .modal').classList.remove('concrete-modal');$('#modalBody').innerHTML=''}
function taskForm(id=null,defaultDate=date,defaultTime=''){const t=id?data.tasks.find(x=>x.id===id):null;if(id&&!t)return;activeModal={kind:'task',id};openModal(t?'Редагувати завдання':'Нове завдання',`<form id="taskForm" class="fields"><label class="field">Назва справи<input name="title" maxlength="250" required placeholder="Наприклад: Завершити роботу над програмою" value="${escapeHtml(t?.title||'')}"></label><label class="field">Деталі<textarea name="description" maxlength="2000" style="min-height:80px" placeholder="За потреби…">${escapeHtml(t?.description||'')}</textarea></label><div class="field-row"><label class="field">Дата<input name="date" required type="date" value="${escapeHtml(t?.date||defaultDate)}"></label><label class="field">Час (необов’язково)<input name="time" type="time" value="${escapeHtml(t?.time||defaultTime)}"></label></div><div class="field-row"><label class="field">Пріоритет<select name="priority"><option value="normal" ${(!t||t.priority==='normal')?'selected':''}>Звичайний</option><option value="high" ${t?.priority==='high'?'selected':''}>Важливий</option><option value="low" ${t?.priority==='low'?'selected':''}>Не терміновий</option></select></label><label class="field">Категорія<input name="category" maxlength="40" placeholder="Робота, сім’я…" value="${escapeHtml(t?.category||'')}"></label></div><label class="field">Кольорова позначка<select name="color"><option value="none" ${(t?.color||'none')==='none'?'selected':''}>Без кольору</option><option value="green" ${t?.color==='green'?'selected':''}>🟢 Зелений</option><option value="orange" ${t?.color==='orange'?'selected':''}>🟠 Помаранчевий</option><option value="pink" ${t?.color==='pink'?'selected':''}>🩷 Рожевий</option><option value="yellow" ${t?.color==='yellow'?'selected':''}>🟡 Жовтий</option></select></label><div class="modal-actions">${t?'<button type="button" class="btn danger delete" id="deleteTask">Видалити</button><button type="button" class="btn" id="tomorrowTask">↪ На наступний день</button>':''}<button type="button" class="btn" data-close-modal>Скасувати</button><button class="btn primary" type="submit">Зберегти</button></div></form>`);activeModal={kind:'task',id}}
function noteForm(id=null){const n=id?data.notes.find(x=>x.id===id):null;if(id&&!n)return;openModal(n?'Редагувати нотатку':'Нова нотатка',`<form id="noteForm" class="fields"><label class="field">Заголовок<input name="title" maxlength="180" placeholder="Назва нотатки" required value="${escapeHtml(n?.title||'')}"></label><label class="field">Текст<textarea name="body" maxlength="100000" style="min-height:230px" placeholder="Запиши все, що хочеш зберегти…">${escapeHtml(n?.body||'')}</textarea></label><label style="display:flex;gap:8px;align-items:center;font-size:13px"><input name="pinned" type="checkbox" ${n?.pinned?'checked':''}> Закріпити зверху</label><div class="modal-actions">${n?'<button type="button" class="btn danger delete" id="deleteNote">Видалити</button>':''}<button type="button" class="btn" data-close-modal>Скасувати</button><button type="submit" class="btn primary">Зберегти</button></div></form>`);activeModal={kind:'note',id}}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`den-za-dnem-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notify('Резервну копію створено')}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const parsed=validate(JSON.parse(r.result));if(!confirm('Замінити поточні завдання і нотатки даними з резервної копії? Цю дію неможливо скасувати.'))return;const prior=data;data=parsed;if(!save()){data=prior;return}notesQuery='';render();notify('Дані відновлено')}catch(e){alert('Не вдалося відкрити резервну копію. Перевірте формат файлу.')}finally{$('#backupFile').value=''}};r.onerror=()=>alert('Не вдалося прочитати файл');r.readAsText(file)}
function handleClick(e){
  const t=e.target.closest('button,[data-edit-task],[data-edit-note]');
  if(!t){const slot=e.target.closest('.board-cell[data-slot-order]');if(slot&&!e.target.closest('input,textarea,select,a'))orderForm(null,slot.dataset.slotOrder,slot.dataset.hour);return}
  if(t.dataset.orderEdit){orderForm(t.dataset.orderEdit,date,'','edit');return}
  if(t.dataset.quickShift!==undefined){shiftProposedOrder(Number(t.dataset.quickShift));return}
if(t.dataset.addOrder!==undefined){orderForm(null,t.dataset.addOrder||date,t.dataset.hour||'');return}if(t.dataset.editOrder){orderForm(t.dataset.editOrder);return}if(t.dataset.weekToday!==undefined){date=today();render();return}if(t.dataset.printBoard!==undefined){window.print();return}if(t.dataset.slotAdd){startSlotEntry(t);return}if(t.dataset.view){setView(t.dataset.view);return}if(t.dataset.filter){filter=t.dataset.filter;render();return}if(t.dataset.shift){date=addDays(date,Number(t.dataset.shift));render();return}if(t.dataset.openDay){date=t.dataset.openDay;setView('day');return}if(t.dataset.addOn){taskForm(null,t.dataset.addOn);return}if(t.dataset.editTask){taskForm(t.dataset.editTask);return}if(t.dataset.editNote){noteForm(t.dataset.editNote);return}if(t.dataset.closeModal!==undefined){closeModal();return}if(t.dataset.export!==undefined){exportData();return}if(t.dataset.import!==undefined){$('#backupFile').click();return}if(t.dataset.rollover!==undefined){const count=data.tasks.filter(x=>!x.done&&x.date<today()).length;if(!count)return;if(confirm(`Перенести ${count} невиконаних справ на сьогодні?`)){data.tasks.forEach(x=>{if(!x.done&&x.date<today())x.date=today()});save();date=today();render();notify('Справи перенесено')}}}
function handleChange(e){const t=e.target;if(t.name==='pumpType'&&t.closest('#orderForm')){togglePumpField();return}if(t.dataset.checkWeekItem!==undefined){const w=monday(date),i=Number(t.dataset.checkWeekItem);if(i>=0&&i<16){const list=ensureChecklist(w);list[i].done=t.checked;save();t.closest('.board-check-row')?.classList.toggle('checked',t.checked)}return}if(t.dataset.checkTask){const o=data.tasks.find(x=>x.id===t.dataset.checkTask);if(o){o.done=t.checked;o.updatedAt=new Date().toISOString();save();render()}return}if(t.dataset.checkGoal){const g=data.goals.find(x=>x.id===t.dataset.checkGoal);if(g){g.done=t.checked;save();render()}return}if(t.id==='dateJump'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){date=t.value;render()}}
function handleSubmit(e){if(e.target.id==='rescheduleOrderForm'){e.preventDefault();submitReschedule(e.target);return}if(e.target.id==='orderForm'){e.preventDefault();if(activeModal?.kind==='order'&&activeModal.mode!=='view')submitOrder(e.target);return}if(e.target.id==='taskForm'){e.preventDefault();const form=new FormData(e.target),title=String(form.get('title')||'').trim();if(!title)return;const obj={title,description:String(form.get('description')||'').trim(),date:String(form.get('date')),time:String(form.get('time')||''),priority:String(form.get('priority')),category:String(form.get('category')||'').trim(),color:['none','green','orange','pink','yellow'].includes(form.get('color'))?String(form.get('color')):'none',updatedAt:new Date().toISOString()};if(activeModal?.id){const t=data.tasks.find(x=>x.id===activeModal.id);if(t)Object.assign(t,obj)}else data.tasks.push({...obj,id:uid(),createdAt:new Date().toISOString(),done:false});save();closeModal();render();notify('Завдання збережено')}else if(e.target.id==='goalForm'){e.preventDefault();const i=e.target.elements.goal;const v=i.value.trim();if(v){data.goals.push({id:uid(),title:v,week:monday(date),done:false});save();render()}}else if(e.target.id==='noteForm'){e.preventDefault();const fd=new FormData(e.target),o={title:String(fd.get('title')||'').trim(),body:String(fd.get('body')||''),pinned:!!fd.get('pinned'),updatedAt:new Date().toISOString()};if(!o.title)return;if(activeModal?.id){const n=data.notes.find(x=>x.id===activeModal.id);if(n)Object.assign(n,o)}else data.notes.push({...o,id:uid(),createdAt:new Date().toISOString()});save();closeModal();render();notify('Нотатку збережено')}}
function handleInput(e){if(e.target.id==='ordersSearch'){ordersQuery=e.target.value;const target=e.target;const caret=target.selectionStart;const temp=document.createElement('div');temp.innerHTML=renderOrders();$('#ordersResults').innerHTML=temp.querySelector('#ordersResults').innerHTML;if(caret!==null)target.setSelectionRange(caret,caret);return}if(e.target.dataset.weekItem!==undefined){const w=monday(date),i=Number(e.target.dataset.weekItem);if(i>=0&&i<16){ensureChecklist(w)[i].text=e.target.value;saveDebounced()}return}if(e.target.dataset.boardNote!==undefined){const key=e.target.dataset.boardNote;data.dailyNotes[key]=e.target.value;saveDebounced();return}if(e.target.id==='boardImportant'){data.weeklyNotes[monday(date)]=e.target.value;saveDebounced();return}if(e.target.id==='dailyNote'||e.target.id==='weeklyNote'){const d=date,w=monday(date),which=e.target.id;const txt=e.target.value;if(which==='dailyNote')data.dailyNotes[d]=txt;else data.weeklyNotes[w]=txt;const status=$('#'+(which==='dailyNote'?'dailySaveStatus':'weeklySaveStatus'));if(status)status.textContent='Зберігаємо…';clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>{save();const s=$('#'+(which==='dailyNote'?'dailySaveStatus':'weeklySaveStatus'));if(s)s.textContent='Збережено ✓'},250)}else if(e.target.id==='notesSearch'){notesQuery=e.target.value;const caret=e.target.selectionStart;const cur=e.target;const grid=renderNotes();const tmp=document.createElement('div');tmp.innerHTML=grid;$('#notesGrid').innerHTML=tmp.querySelector('#notesGrid').innerHTML;cur.focus();if(caret!==null)cur.setSelectionRange(caret,caret)}}
document.addEventListener('click',e=>{if(e.target.id==='deleteOrder'&&activeModal?.kind==='order'){if(confirm('Видалити це замовлення бетону?')){data.orders=data.orders.filter(o=>o.id!==activeModal.id);save();closeModal();render();notify('Замовлення видалено')}return}if(e.target.id==='tomorrowTask'&&activeModal?.kind==='task'&&activeModal.id){const t=data.tasks.find(x=>x.id===activeModal.id);if(t){t.date=addDays(t.date,1);t.updatedAt=new Date().toISOString();save();closeModal();render();notify('Справу перенесено на наступний день')}return}if(e.target.id==='deleteTask'&&activeModal?.kind==='task'){if(confirm('Видалити це завдання?')){data.tasks=data.tasks.filter(t=>t.id!==activeModal.id);save();closeModal();render();notify('Завдання видалено')}return}if(e.target.id==='deleteNote'&&activeModal?.kind==='note'){if(confirm('Видалити цю нотатку?')){data.notes=data.notes.filter(t=>t.id!==activeModal.id);save();closeModal();render();notify('Нотатку видалено')}return}if(e.target.dataset.deleteGoal){data.goals=data.goals.filter(x=>x.id!==e.target.dataset.deleteGoal);save();render();return}handleClick(e)});
document.addEventListener('change',handleChange);document.addEventListener('submit',handleSubmit);document.addEventListener('input',handleInput);$('#newTask').onclick=()=>view==='notes'?noteForm():(view==='week'||view==='orders')?orderForm():taskForm();$('#goToday').onclick=()=>{date=today();render()};$('#exportSide').onclick=exportData;$('#importSide').onclick=()=>$('#backupFile').click();$('#backupFile').onchange=e=>importData(e.target.files[0]);$('#modalLayer').addEventListener('click',e=>{if(e.target.id==='modalLayer')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeModal)closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();view==='notes'?noteForm():taskForm()}});window.addEventListener('beforeunload',()=>{clearTimeout(autosaveTimer);save()});render();
})();
